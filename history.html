<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808"><title>历史记录 · 爆款视频脚本AI</title>
<meta name="description" content="查看模拟分镜历史记录，体验详情、再次生成与空状态；保留原有本机历史，无真实数据库。">
<link rel="stylesheet" href="style.css?v=responsive-1"><link rel="stylesheet" href="history.css?v=responsive-1">
<script src="history-store.js?v=1" defer></script><script src="history-demo.js?v=1" defer></script><script src="history.js?v=3" defer></script><script src="site-nav.js?v=3" defer></script><script src="button-glow.js?v=performance-2" defer></script>
</head>
<body class="home-refined history-page">
<a class="skip-link" href="#history-main">跳到历史记录</a>
<header class="site-header"><nav class="nav shell" aria-label="主导航"><a class="logo" href="index.html#home"><span class="logo-mark" aria-hidden="true">✳</span>爆款视频脚本AI<span class="demo-badge">演示版</span></a><div class="nav-links"><a class="nav-home" href="index.html#home">首页</a><a href="history.html" aria-current="page">历史记录</a><a class="nav-cta" href="workspace.html">返回工作台 <span aria-hidden="true">↗</span></a></div></nav></header>
<main class="shell history-main" id="history-main">
<div class="history-heading"><div><span class="section-kicker">你的创作档案</span><h1>历史记录</h1><p>回看每一次创作，从已有的想法继续出发。</p></div><a class="button primary" href="workspace.html">去生成 <span aria-hidden="true">↗</span></a></div>
<div class="history-notice"><strong id="history-source-title">当前显示模拟数据</strong><p id="history-source-help">以下为固定示例，不是你的真实生成记录；不接数据库，也不会写入本机历史。</p><p>“再次生成”只将需求带回工作台，确认后再生成；不会读取或恢复视频。</p></div>
<div class="history-toolbar"><div class="history-source-switch" role="group" aria-label="记录来源"><button type="button" id="history-demo" aria-pressed="true">模拟记录</button><button type="button" id="history-local" aria-pressed="false">本机记录</button></div><button type="button" id="history-toggle-empty" class="button secondary" aria-pressed="false" aria-controls="history-list history-empty">体验空状态</button></div>
<p id="history-status" class="field-help" role="status"></p>
<section id="history-empty" class="card history-empty" hidden aria-labelledby="history-empty-title"><span class="history-empty-icon" aria-hidden="true">↶</span><span id="history-empty-label" class="history-empty-label">模拟空状态</span><h2 id="history-empty-title">你还没有生成记录。</h2><p id="history-empty-help">这里仅演示无数据时的界面，不会删除模拟记录或已有本机记录。</p><a class="button primary" href="workspace.html">去生成 <span aria-hidden="true">↗</span></a></section>
<section id="history-list" class="history-list" aria-label="脚本历史记录"></section>
<noscript><p>请启用 JavaScript，才能体验模拟记录或查看本机历史。</p></noscript>
</main>
<footer class="site-footer shell"><span>爆款视频脚本AI</span><p>从好灵感，到好表达。</p><span>本地演示 · 无需 API Key</span></footer>
</body></html>
